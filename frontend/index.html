<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench</title>
<!--
  Bench's window. Go owns the state and the geometry: it sends a View in
  bench:state events, and the UI draws it and calls Go's bound methods
  (docs/architecture.md, "Go and the frontend"). Plain ES modules, no build
  step; js/app.js is the entry point.
-->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="light.css" id="light-tokens" media="(prefers-color-scheme: light)">
</head>
<body class="is-app">

<div class="proto-bar" id="demo-bar" hidden>
  <strong>Bench browser preview</strong>
  <div class="seg" role="radiogroup" aria-label="Simulated screen" data-activate="manual" id="screen-picker"></div>
  <span class="proto-simulate" id="demo-simulate-group">
    <button type="button" class="btn small" id="demo-simulate" data-action="demo-simulate" aria-expanded="false" aria-controls="demo-simulate-menu" title="Pretend that something happens, as on a Mac">Simulate<span class="proto-chevron" aria-hidden="true"></span></button>
    <span class="proto-pop" id="demo-simulate-menu" role="group" aria-label="Simulate" hidden>
      <button type="button" class="btn small" data-action="demo-minimise" title="Minimise the window the focused pane shows, as ⌘M does in the app">Minimise window</button>
      <button type="button" class="btn small" data-action="demo-come-forward" title="Pretend that you clicked Bench while another app was in front, as on a Mac: Bench hides the windows that cover it">Bring Bench forward</button>
      <button type="button" class="btn small" id="demo-monitor" data-action="demo-monitor" title="Pretend that you unplug the monitor, as on a Mac: Bench goes to the laptop's screen. Choose Monitor first">Unplug monitor</button>
      <button type="button" class="btn small" id="demo-voiceover" data-action="demo-voiceover" aria-pressed="false" title="Pretend that VoiceOver is on, as on a Mac: the terminals are read out, and bells and finished commands are announced">VoiceOver</button>
      <button type="button" class="btn small" id="demo-window-tool" data-action="demo-window-tool" aria-pressed="false" title="Pretend that Rectangle, a window tool, is running, as on a Mac: the status bar says what it can do to Bench">Rectangle</button>
      <button type="button" class="btn small" id="demo-tool-moves" data-action="demo-tool-moves" title="Pretend that something keeps moving the window the focused pane shows out of the pane, as a window tool or the app can on a Mac">Keep moving window</button>
    </span>
  </span>
  <span class="proto-hint" id="demo-hint"></span>
</div>

<div class="stage" id="stage">
  <div class="window" id="app-window" data-screen="fit">
    <header class="titlebar" id="titlebar"></header>
    <div class="banner" id="banner" hidden></div>
    <main class="panes" id="panes"></main>
    <footer class="statusbar" id="statusbar"></footer>
    <div class="layer" id="menu-root"></div>
    <div class="layer" id="overlay-root"></div>
    <div class="preview" id="preview" hidden></div>
    <div class="toast" role="status" aria-live="polite" id="toast"></div>
    <div class="term-park" id="term-park" aria-hidden="true"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
