name: macOS web apps

# Checks, on a real Mac, that Bench finds and docks the web apps that Safari,
# Chrome, Edge, Brave, and Vivaldi make. It runs when started by hand, or for
# a push whose head commit (the last one pushed) has [macos-webapps] in its
# message; earlier commits in the push don't count. See
# scripts/macos-webapps/run.sh and docs/development.md.

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  webapps:
    name: Dock web apps
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[macos-webapps]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Bench and the scan
        run: |
          go build -o bin/bench ./cmd/bench
          go build -o bin/scanapps ./scripts/macos-webapps/scanapps

      - name: Install the browsers
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          # The image comes with Chrome and Edge; install them if it doesn't.
          [ -d "/Applications/Google Chrome.app" ] || brew install --cask google-chrome
          [ -d "/Applications/Microsoft Edge.app" ] || brew install --cask microsoft-edge
          brew install --cask brave-browser vivaldi
          for app in "Google Chrome" "Microsoft Edge" "Brave Browser" Vivaldi; do
            xattr -dr com.apple.quarantine "/Applications/$app.app" || true
          done

      - name: Make web apps and dock them
        run: bash scripts/macos-webapps/run.sh bin/bench bin/scanapps webapps-out

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-webapps
          path: webapps-out
          retention-days: 7
