    if (e.target.closest && e.target.closest('.subtab')) hidePreview();
  });

  // ----- Keyboard -----

  document.addEventListener('keydown', (e) => {
    const chord = e.ctrlKey && e.altKey && !e.metaKey;
    const arrows = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };

    if (chord && !state.overlay) {
      if (/^Digit[1-9]$/.test(e.code)) { e.preventDefault(); switchTab(Number(e.code.slice(5)) - 1); return; }
      if (e.code === 'Digit0') { e.preventDefault(); toast('Rearranged ' + state.tabs[state.current].name); return; }
      if (e.code === 'BracketRight') { e.preventDefault(); switchTab((state.current + 1) % state.tabs.length); return; }
      if (e.code === 'BracketLeft') { e.preventDefault(); switchTab((state.current - 1 + state.tabs.length) % state.tabs.length); return; }
      if (e.code === 'Tab') { e.preventDefault(); cycleSubtab(e.shiftKey ? -1 : 1); return; }
      if (arrows[e.code]) {
        e.preventDefault();
        if (e.shiftKey) moveFocusedWindow(arrows[e.code]); else focusNeighbour(arrows[e.code]);
        return;
      }
    }
    if ((chord && e.code === 'Space') || (e.ctrlKey && !e.altKey && !e.metaKey && e.code === 'KeyK')) {
      e.preventDefault();
      if (state.overlay === 'palette') closeOverlay(); else openPalette('palette');
      return;
    }

    // Menu keyboard use.
    if (state.menu) {
      const items = Array.from(document.querySelectorAll('.menu-item:not([disabled])'));
      const i = items.indexOf(document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); state.menu = null; update(); if (opener) opener.focus(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); return; }
      return;
    }

    if (!state.overlay) return;
    if (e.key === 'Escape') { e.preventDefault(); closeOverlay(); return; }

    if ((state.overlay === 'palette' || state.overlay === 'add') && e.target.id === 'palette-query') {
      const items = state.overlay === 'add' ? addItems() : paletteItems();
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        state.palette.sel = Math.min(state.palette.sel + 1, Math.max(items.length - 1, 0));
        update();
        scrollSelectedIntoView();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        state.palette.sel = Math.max(state.palette.sel - 1, 0);
        update();
        scrollSelectedIntoView();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        runListItem(items, Math.min(state.palette.sel, items.length - 1));
      }
      return;
    }

    // Keep Tab inside the open dialog.
    if (e.key === 'Tab') {
      const dialog = document.querySelector('.dialog');
      if (!dialog) return;
      const focusables = Array.from(dialog.querySelectorAll('button:not([tabindex="-1"]), input, select, [href]'))
        .filter((el) => !el.disabled);
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function scrollSelectedIntoView() {
    const el = document.querySelector('.palette-item[aria-selected="true"]');
    if (el && typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: 'nearest' });
  }

  // "Fit to browser" uses the browser width as the screen width.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (state.screen !== 'fit') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(update, 100);
  });

  // For debugging and tests in the browser console.
  window.bench = { state, render: update, leaves, locate, moveItem, moveToTab };

  seed();
  update();
})();
</script>
</body>
</html>
